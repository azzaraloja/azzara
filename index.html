<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azzara Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo">AZZARA<small>COLLECTION</small></div><div><button class="btn o sm" onclick="acct()">Minha conta</button> <button class="btn sm" onclick="bag()">Sacola (<span id="n">0</span>)</button></div></header>
<div class="hero"><h1>Seu estilo, sua essência</h1><p class="m">Saltos e sandálias · Araguaína-TO · Enviamos para todo o Brasil</p></div>
<div class="wrap"><div class="grid" id="g"></div></div>
<dialog id="dlg"><div id="d"></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let P=[],sel,cart=JSON.parse(localStorage.cart||'[]');
const save=()=>{localStorage.cart=JSON.stringify(cart);$('#n').textContent=cart.reduce((a,i)=>a+i.qty,0)};
const modal=h=>{$('#d').innerHTML=h;$('#dlg').open||$('#dlg').showModal()};
async function load(){const{data}=await sb.from('products').select('*,variants(size,stock)').eq('active',true).order('created_at',{ascending:false});P=data||[];
$('#g').innerHTML=P.map(p=>`<div class=card onclick="one('${p.id}')"><img src="${e(p.image_url)}" alt="${e(p.name)}"><div class=pi><h3>${e(p.name)}</h3><b>${R(p.price)}</b></div></div>`).join('')||'<p class=m>Novidades em breve.</p>'}
function one(id){const p=P.find(x=>x.id==id);sel=null;
modal(`<img class=big src="${e(p.image_url)}"><h2>${e(p.name)}</h2><p class=m>${e(p.description)}</p><h3>${R(p.price)}</h3><div class=sz>${p.variants.filter(v=>v.stock>0).sort((a,b)=>a.size-b.size).map(v=>`<button class=s onclick="pick(this,'${v.size}')">${v.size}</button>`).join('')||'<span class=m>Esgotado</span>'}</div><button class="btn r" onclick="add('${id}')">Adicionar à sacola</button> <button class="btn o" onclick="$('#dlg').close()">Fechar</button>`)}
function pick(b,s){sel=s;document.querySelectorAll('.s').forEach(x=>x.classList.toggle('on',x==b))}
function add(id){if(!sel)return alert('Escolha o tamanho');const p=P.find(x=>x.id==id),i=cart.find(c=>c.id==id&&c.size==sel);i?i.qty++:cart.push({id,size:sel,qty:1,name:p.name,price:p.price});save();bag()}
function del(i){cart.splice(i,1);save();bag()}
function bag(){const t=cart.reduce((a,i)=>a+i.price*i.qty,0);
modal(`<h2>Sua sacola</h2>${cart.map((i,k)=>`<div class=row><span>${e(i.name)} · tam. ${i.size} · ${i.qty}x<br><b>${R(i.price*i.qty)}</b></span><button class="btn o sm" onclick="del(${k})">Remover</button></div>`).join('')||'<p class=m>Sacola vazia.</p>'}
<h3 style="margin:.8rem 0">Total ${R(t)}</h3><label>Nome</label><input id=cn><label>WhatsApp</label><input id=ct type=tel><label>Endereço completo</label><textarea id=ca rows=2></textarea>
<button class="btn r" onclick="fin()">Finalizar pedido</button> <button class="btn o" onclick="$('#dlg').close()">Continuar comprando</button>`)}
async function fin(){const n=$('#cn').value,t=$('#ct').value,a=$('#ca').value;if(!n||!t||!a||!cart.length)return alert('Preencha seus dados.');
const{data,error}=await sb.rpc('create_order',{p_name:n,p_phone:t,p_address:a,p_items:cart.map(i=>({product_id:i.id,size:i.size,qty:i.qty}))});
if(error)return alert(error.message);
const tx=`Olá! Fiz o pedido #${data.slice(0,6)} na Azzara:\n`+cart.map(i=>`• ${i.name} tam ${i.size} x${i.qty}`).join('\n')+`\nTotal: ${R(cart.reduce((a,i)=>a+i.price*i.qty,0))}\nNome: ${n}\nEndereço: ${a}`;
cart=[];save();location.href=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(tx)}`}
async function acct(){const{data:{session}}=await sb.auth.getSession();
if(!session)return modal(`<h2>Minha conta</h2><label>E-mail</label><input id=le type=email><label>Senha (mín. 6)</label><input id=lp type=password><button class="btn r" onclick="auth('in')">Entrar</button> <button class="btn o" onclick="auth('up')">Criar conta</button>`);
const{data}=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});
modal(`<h2>Meus pedidos</h2>${(data||[]).map(o=>`<div class=row><span>#${o.id.slice(0,6)} · ${new Date(o.created_at).toLocaleDateString('pt-BR')}<br>${o.order_items.map(i=>e(i.name)+' '+i.size).join(', ')}</span><span><b>${R(o.total)}</b><br>${o.status}</span></div>`).join('')||'<p class=m>Nenhum pedido ainda.</p>'}<button class="btn o" onclick="sb.auth.signOut().then(()=>$('#dlg').close())">Sair</button> <button class="btn o" onclick="$('#dlg').close()">Fechar</button>`)}
async function auth(k){const c={email:$('#le').value,password:$('#lp').value};const{error}=k=='in'?await sb.auth.signInWithPassword(c):await sb.auth.signUp(c);
if(error)return alert(error.message);k=='up'&&alert('Conta criada! Confirme no e-mail se pedido.');acct()}
save();load();
</script></body></html>
